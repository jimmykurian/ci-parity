# Pinned dev tools. CI installs these with jdx/mise-action; locally, run
# `mise install`. Go is pinned by the toolchain line in go.mod, not here.
[tools]
task = "3.53.1"

# Go
golangci-lint = "2.15.0" # also runs the gofumpt and goimports formatters
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
goreleaser = "2.18.3" # release builds; also pinned in .github/workflows/release.yml

# Workflows and secrets
actionlint = "1.7.11"
zizmor = "1.31.1"
gitleaks = "8.30.0"

# Shell, YAML, Markdown, spelling, EditorConfig
shellcheck = "0.11.0"
uv = "0.13.5" # runs pipx tools
"pipx:yamllint" = "1.38.0"
node = "24.22.1" # for pnx, which runs markdownlint-cli2 (version in Taskfile.yml)
"npm:pnpm" = "11.21.0" # 12.x releases fail mise's npm provenance (trust) check
typos = "1.51.1"
"aqua:boyter/scc" = "4.1.0" # lines of code for task metrics
editorconfig-checker = "4.0.2"
