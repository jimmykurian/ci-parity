version: "3"

vars:
  BIN: ./bin/ci-parity
  MARKDOWNLINT: markdownlint-cli2@0.23.3
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ

tasks:
  build:
    desc: Build ./bin/ci-parity
    cmds:
      - go build -ldflags "-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}" -o {{.BIN}} ./cmd/ci-parity

  test:
    desc: Run tests; `task test -- -update` regenerates golden files
    cmds:
      # Extra args such as -update go to the golden test alone; only its harness defines -update.
      - '{{if .CLI_ARGS}}go test ./cmd/ci-parity -run TestGolden {{.CLI_ARGS}}{{else}}go test ./...{{end}}'

  lint:
    desc: Run every linter
    cmds:
      - task: lint:go
      - task: lint:vuln
      - task: lint:actions
      - task: lint:shell
      - task: lint:yaml
      - task: lint:markdown
      - task: lint:spelling
      - task: lint:editorconfig
      - task: lint:release

  lint:go:
    desc: Lint Go code (golangci-lint)
    preconditions:
      - sh: command -v golangci-lint
        msg: "golangci-lint not found on PATH; run `mise install` or see https://golangci-lint.run/welcome/install/"
    cmds:
      - golangci-lint run ./...

  lint:vuln:
    desc: Check Go dependencies and the standard library for known vulnerabilities (govulncheck)
    preconditions:
      - sh: command -v govulncheck
        msg: "govulncheck not found on PATH; run `mise install` or `go install golang.org/x/vuln/cmd/govulncheck@v1.9.0`"
    cmds:
      - govulncheck ./...

  lint:actions:
    desc: Lint the GitHub Actions workflows (actionlint, zizmor)
    preconditions:
      - sh: command -v actionlint
        msg: "actionlint not found on PATH; run `mise install` or see https://github.com/rhysd/actionlint/blob/main/docs/install.md"
      - sh: command -v zizmor
        msg: "zizmor not found on PATH; run `mise install` or see https://docs.zizmor.sh/installation/"
    cmds:
      - actionlint
      - zizmor --offline .github

  lint:shell:
    desc: Lint the shell scripts and git hooks (shellcheck)
    preconditions:
      - sh: command -v shellcheck
        msg: "shellcheck not found on PATH; run `mise install` or see https://github.com/koalaman/shellcheck#installing"
    cmds:
      - git ls-files -z '*.sh' '.githooks/*' | xargs -0 shellcheck

  lint:yaml:
    desc: Lint the repo's YAML, not the fixtures (yamllint)
    preconditions:
      - sh: command -v yamllint
        msg: "yamllint not found on PATH; run `mise install` or see https://yamllint.readthedocs.io/en/stable/quickstart.html"
    cmds:
      - git ls-files -z '*.yml' '*.yaml' ':!:testdata/' | xargs -0 yamllint --strict -c .config/linters/yamllint.yml

  lint:markdown:
    desc: Lint the Markdown files (markdownlint-cli2, run with pnx)
    preconditions:
      - sh: command -v pnx
        msg: "pnx not found on PATH; run `mise install` (it comes with pnpm)"
    cmds:
      - pnx {{.MARKDOWNLINT}} --config .config/linters/.markdownlint-cli2.jsonc

  lint:spelling:
    desc: Spell-check code, docs, workflows and fixtures (typos)
    preconditions:
      - sh: command -v typos
        msg: "typos not found on PATH; run `mise install` or see https://github.com/crate-ci/typos#install"
    cmds:
      - typos --hidden --config .config/linters/typos.toml

  lint:editorconfig:
    desc: Check every file against .editorconfig (editorconfig-checker)
    preconditions:
      - sh: command -v editorconfig-checker
        msg: "editorconfig-checker not found on PATH; run `mise install` or see https://editorconfig-checker.github.io"
    cmds:
      # Indentation is left to gofumpt, yamllint and markdownlint, which know
      # each format; this checks charset, line endings, final newlines and
      # trailing whitespace.
      - editorconfig-checker -config .config/linters/editorconfig-checker.json

  fmt:
    desc: Format Go code (gofumpt and goimports, through golangci-lint)
    preconditions:
      - sh: command -v golangci-lint
        msg: "golangci-lint not found on PATH; run `mise install` or see https://golangci-lint.run/welcome/install/"
    cmds:
      - golangci-lint fmt

  fmt:check:
    desc: Fail on unformatted Go code, printing the diff
    preconditions:
      - sh: command -v golangci-lint
        msg: "golangci-lint not found on PATH; run `mise install` or see https://golangci-lint.run/welcome/install/"
    cmds:
      - golangci-lint fmt --diff

  lint:release:
    desc: Validate .goreleaser.yaml (goreleaser check)
    preconditions:
      - sh: command -v goreleaser
        msg: "goreleaser not found on PATH; run `mise install` or see https://goreleaser.com/install/"
    cmds:
      - goreleaser check

  action:expect:
    desc: "Check the action's outputs in ERRORS, WARNINGS and TOLERATED: task action:expect -- 8 0 0 (CI runs this)"
    silent: true
    requires:
      vars: [CLI_ARGS]
    cmds:
      - |
        read -r errors warnings tolerated <<< "{{.CLI_ARGS}}"
        got="${ERRORS:-} ${WARNINGS:-} ${TOLERATED:-}"
        want="$errors $warnings $tolerated"
        if [ "$got" != "$want" ]; then
          echo "action outputs (errors warnings tolerated): got '$got', want '$want'" >&2
          exit 1
        fi
        echo "action outputs: $got"

  release:snapshot:
    desc: Build every release archive into dist/ without publishing
    preconditions:
      - sh: command -v goreleaser
        msg: "goreleaser not found on PATH; run `mise install` or see https://goreleaser.com/install/"
    cmds:
      - goreleaser release --snapshot --clean

  release:float:
    desc: "Point the floating major tag at a release: task release:float -- v0.1.0 (the release workflow runs this)"
    silent: true
    requires:
      vars: [CLI_ARGS]
    preconditions:
      - sh: command -v gh
        msg: "gh not found on PATH; see https://cli.github.com"
    cmds:
      - |
        tag="{{.CLI_ARGS}}"
        case "$tag" in
          v[0-9]*.[0-9]*.[0-9]*-*) echo "$tag is a pre-release; leaving the major tag alone"; exit 0 ;;
          v[0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "not a vX.Y.Z tag: $tag" >&2; exit 1 ;;
        esac
        major="${tag%%.*}"
        repo="${GITHUB_REPOSITORY:-$(gh repo view --json nameWithOwner --jq .nameWithOwner)}"
        sha=$(gh api "repos/$repo/commits/$tag" --jq .sha)
        if gh api "repos/$repo/git/ref/tags/$major" > /dev/null 2>&1; then
          gh api -X PATCH "repos/$repo/git/refs/tags/$major" -f sha="$sha" -F force=true > /dev/null
        else
          gh api -X POST "repos/$repo/git/refs" -f ref="refs/tags/$major" -f sha="$sha" > /dev/null
        fi
        echo "$major -> $sha ($tag)"

  hooks:install:
    desc: Use the git hooks in .githooks/ (pre-commit, commit-msg, pre-push)
    cmds:
      - git config core.hooksPath .githooks

  self-check:
    desc: Run ci-parity against this repo
    cmds:
      - go run ./cmd/ci-parity check

  scrub:
    desc: Fail if tracked or untracked files contain a term from $SCRUB_TERMS_FILE
    cmds:
      - |
        if [ -z "${SCRUB_TERMS_FILE:-}" ]; then
          echo "warning: SCRUB_TERMS_FILE is unset; skipping scrub"
          exit 0
        fi
        if [ ! -r "$SCRUB_TERMS_FILE" ]; then
          echo "SCRUB_TERMS_FILE=$SCRUB_TERMS_FILE is not readable"
          exit 1
        fi
        # Blank lines would match everything; lines starting with # are comments.
        terms=$(mktemp)
        trap 'rm -f "$terms"' EXIT
        grep -v -e '^[[:space:]]*$' -e '^#' "$SCRUB_TERMS_FILE" > "$terms" || true
        if [ ! -s "$terms" ]; then
          echo "scrub: no terms in $SCRUB_TERMS_FILE"
          exit 0
        fi
        if git grep --untracked -I -n -i -F -f "$terms"; then
          echo "scrub: forbidden terms found"
          exit 1
        fi
        echo "scrub: clean"

  ci:
    desc: Run every check CI runs
    cmds:
      - task: fmt:check
      - task: lint
      - task: test
      - task: build
      - task: self-check
      - task: scrub
