name: ci
on: [push]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test # keep this comment
      - name: Lint with a wrapper
        run: sudo pnpm lint
      - name: Wrappers with options
        run: sudo -E env CI=1 timeout 300 pnpm build
      - name: Variable prefix
        run: NODE_ENV=test pnpm test
      - name: Double quotes
        run: "pnpm test"
      - name: Single quotes
        run: 'pnpm lint'
      - name: One-line block
        run: |
          pnpm test
      - name: Chain
        run: pnpm build && pnpm test
      - name: Escaped quotes
        run: "pnpm\ttest"
      - name: Expression
        run: pnpm test --shard=${{ matrix.shard }}
      - name: Multi-line block
        run: |
          pnpm install
          pnpm test
      - name: Redirect
        run: pnpm test > out.txt
      - name: No task
        run: pnpm audit
      - name: Allowed
        run: pnpm publish # ci-parity: allow publishes from CI
