name: ci
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Wrapped
        run: |
          sudo -E apt-get install -y jq
          sudo -E docker compose up -d
          env CI=1 pnpm test
          NODE_ENV=test pnpm lint
          timeout 300 go test ./...
          nice -n 10 cargo build
          time npm ci
          nohup node server.js &
      - name: Invokers
        run: |
          go tool task build
          env CI=1 task test
          go-task build
      - name: Go tool that is not task
        run: go tool cover -func=coverage.out
      - name: Wrapper flags that take values
        run: |
          sudo -u deploy docker push ghcr.io/acme/widget-service
          timeout -k 5 30s pnpm test
          env -u HOME -C web pnpm build
          ionice -c 2 -n 7 make all
          /usr/bin/time -f %e npm ci
          env -S 'pnpm test --coverage'
