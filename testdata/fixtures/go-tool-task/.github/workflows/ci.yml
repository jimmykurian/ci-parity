name: ci
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: go tool task
        run: go tool task build
      - name: go-task binary
        run: go-task test
      - name: Unknown through go tool task
        run: go tool task tset
      - name: Inline go test has a task
        run: go test ./...
      - name: go tool with task's module path
        run: |
          go tool \
            github.com/go-task/task/v3/cmd/task build
      - name: go run with a version
        run: go run github.com/go-task/task/v3/cmd/task@v3.40.0 test
      - name: Unknown through go run
        run: go run github.com/go-task/task/v3/cmd/task tset
