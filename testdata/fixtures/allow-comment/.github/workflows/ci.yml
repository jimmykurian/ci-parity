name: ci
on: [push]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        run: |
          docker push widget-service # ci-parity: allow images publish only from CI
          # ci-parity: allow the registry login has no local equivalent
          docker login ghcr.io
          docker push widget-service:latest
      - name: Missing reason
        run: pnpm publish # ci-parity: allow
      - name: One-line allow
        run: docker push widget-service:edge # ci-parity: allow edge images publish from CI
      - name: Quoted one-line allow
        run: "npm publish" # ci-parity: allow package publish needs the CI token
