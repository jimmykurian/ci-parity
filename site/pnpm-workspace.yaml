# pnpm settings for the docs site (`task site:install`).

# Install scripts are off unless listed here. esbuild and sharp get their binaries from
# platform packages, so their postinstall checks aren't needed.
allowBuilds:
  esbuild: false
  sharp: false

overrides:
  # GHSA-238p-pmpm-9mq7 (Dependabot alert 1), via astro-mermaid > mermaid, whose 11.x
  # line pins katex ^0.16. The docs' diagrams use no math, so katex isn't exercised.
  'katex@<0.18.2': '^0.18.2'
