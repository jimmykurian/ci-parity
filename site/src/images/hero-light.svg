<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 370" role="img" aria-labelledby="t d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="t">ci-parity turns an inline tool call into a task</title>
  <desc id="d">A workflow step that runs pnpm test is flagged P001, already available as task test. ci-parity fix rewrites the step to run task test, and it passes.</desc>
  <rect x="10" y="10" width="420" height="140" rx="14" fill="#ffffff" stroke="#d5d9e2" stroke-width="1.5"/>
  <path d="M10 24 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v20 h-420 z" fill="#f2f4f8"/>
  <circle cx="30" cy="27" r="5" fill="#c3c8d3"/><circle cx="47" cy="27" r="5" fill="#c3c8d3"/><circle cx="64" cy="27" r="5" fill="#c3c8d3"/>
  <text x="82" y="32" font-size="15" fill="#5f6779">.github/workflows/ci.yml</text>
  <rect x="22" y="66" width="292" height="36" rx="6" fill="#cf3a3a1a"/>
  <text x="34" y="92" font-size="24" fill="#cf3a3a" xml:space="preserve">- run: pnpm test</text>
  <path d="M135 99 q3 4 6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0" fill="none" stroke="#cf3a3a" stroke-width="2"/>
  <rect x="326" y="66" width="92" height="36" rx="18" fill="#cf3a3a"/>
  <text x="372" y="91" font-size="19" font-weight="700" text-anchor="middle" fill="#ffffff">P001</text>
  <text x="34" y="134" font-size="16" fill="#5f6779">already available as 'task test'</text>
  <path d="M120 158 V 222" stroke="#4b56d2" stroke-width="2.5"/>
  <path d="M110 212 L120 226 L130 212" fill="none" stroke="#4b56d2" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="150" y="173" width="190" height="38" rx="19" fill="#4b56d214" stroke="#4b56d2" stroke-width="1.5"/>
  <text x="245" y="198" font-size="18" text-anchor="middle" fill="#4b56d2">ci-parity fix</text>
  <rect x="10" y="236" width="420" height="124" rx="14" fill="#ffffff" stroke="#d5d9e2" stroke-width="1.5"/>
  <path d="M10 250 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v20 h-420 z" fill="#f2f4f8"/>
  <circle cx="30" cy="253" r="5" fill="#c3c8d3"/><circle cx="47" cy="253" r="5" fill="#c3c8d3"/><circle cx="64" cy="253" r="5" fill="#c3c8d3"/>
  <text x="82" y="258" font-size="15" fill="#5f6779">.github/workflows/ci.yml</text>
  <rect x="22" y="292" width="292" height="36" rx="6" fill="#1d8a4c1a"/>
  <text x="34" y="318" font-size="24" fill="#1d8a4c" xml:space="preserve">- run: task test</text>
  <circle cx="372" cy="310" r="19" fill="#1d8a4c"/>
  <path d="M362 310 l7 7 l13 -14" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
