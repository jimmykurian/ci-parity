name: release

# On every push to main, Release Please opens or updates one release PR that bumps the
# version and CHANGELOG.md from the Conventional Commits since the last release. Merging
# that PR creates the vX.Y.Z tag and the GitHub Release; the publish job then attaches the
# goreleaser archives and checksums.txt and moves the floating major tag (v0).
#
# It runs with GITHUB_TOKEN, so the release PR doesn't start the other workflows: close and
# reopen it to run its checks before merging. A tag created with GITHUB_TOKEN doesn't start
# workflows either, which is why publishing happens here rather than on a tag push.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release commit, tag and GitHub Release
      pull-requests: write # the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  publish:
    name: Publish
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # uploads the archives and moves the major tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          # goreleaser reads the tags and the commit dates.
          fetch-depth: 0
          persist-credentials: false
      # No caches in a release build: a cache another workflow wrote could taint the binaries.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: task
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3 # same as mise.toml
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: task release:float -- "$TAG"
