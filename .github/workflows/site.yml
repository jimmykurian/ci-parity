# Builds the docs site from docs/ and deploys it to GitHub Pages at
# https://ci-parity.is-a.dev/. Pull requests build it in ci.yml; this
# deploys what lands on main.
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "Taskfile.yml"
      - "mise.toml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions: {}

# One deploy at a time; a newer push replaces a queued one, never a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No caches: what is deployed is built from the lockfile alone.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          cache: false
      - run: task site:install
      - run: task site:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publishes the artifact to GitHub Pages
      id-token: write # proves to Pages the artifact came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
