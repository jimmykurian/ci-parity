name: Pull request labels

# Labels each pull request by the paths it changes (.github/labeler.yml). It runs on
# pull_request, not pull_request_target, so the token never acts on code from a fork;
# a fork's pull request gets a read-only token and goes unlabeled.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # adds and removes the labels
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
