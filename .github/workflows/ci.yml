name: ci

# Every check, then a table of their results on the pull request:
#
#   checks ─────┬─ report (the PR comment)
#   self-check ─┴─ badges (main only: the README status table)
#
# Each check is its own step running a task from Taskfile.yml, with tools from
# mise.toml, so CI runs the same commands as a local `task ci`. Every step runs even
# when an earlier one fails (`!cancelled()`), so the table shows each result, and any
# failed step still fails its job.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # gitleaks-action lists a pull request's commits to scan them.
      pull-requests: read
    outputs:
      secrets: ${{ steps.secrets.outcome }}
      fmt: ${{ steps.fmt.outcome }}
      go: ${{ steps.go.outcome }}
      vuln: ${{ steps.vuln.outcome }}
      actions: ${{ steps.actions.outcome }}
      shell: ${{ steps.shell.outcome }}
      yaml: ${{ steps.yaml.outcome }}
      markdown: ${{ steps.markdown.outcome }}
      spelling: ${{ steps.spelling.outcome }}
      editorconfig: ${{ steps.editorconfig.outcome }}
      headers: ${{ steps.headers.outcome }}
      release: ${{ steps.release.outcome }}
      unit: ${{ steps.unit.outcome }}
      integration: ${{ steps.integration.outcome }}
      e2e: ${{ steps.e2e.outcome }}
      build: ${{ steps.build.outcome }}
      site_test: ${{ steps.site_test.outcome }}
      site_build: ${{ steps.site_build.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21

      - id: secrets
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The same tasks as `task ci`, one step each.
      - id: fmt
        if: ${{ !cancelled() }}
        run: task fmt:check
      - id: go
        if: ${{ !cancelled() }}
        run: task lint:go
      - id: vuln
        if: ${{ !cancelled() }}
        run: task lint:vuln
      - id: actions
        if: ${{ !cancelled() }}
        run: task lint:actions
      - id: shell
        if: ${{ !cancelled() }}
        run: task lint:shell
      - id: yaml
        if: ${{ !cancelled() }}
        run: task lint:yaml
      - id: markdown
        if: ${{ !cancelled() }}
        run: task lint:markdown
      - id: spelling
        if: ${{ !cancelled() }}
        run: task lint:spelling
      - id: editorconfig
        if: ${{ !cancelled() }}
        run: task lint:editorconfig
      - id: headers
        if: ${{ !cancelled() }}
        run: task lint:headers
      - id: release
        if: ${{ !cancelled() }}
        run: task lint:release
      - id: unit
        if: ${{ !cancelled() }}
        run: task test:unit
      - id: integration
        if: ${{ !cancelled() }}
        run: task test:integration
      - id: e2e
        if: ${{ !cancelled() }}
        run: task test:e2e
      - id: build
        if: ${{ !cancelled() }}
        run: task build
      # The docs site: install its pinned packages, test the docs sync, then build it,
      # which fails on a broken link or anchor in docs/.
      - id: site_install
        if: ${{ !cancelled() }}
        run: task site:install
      - id: site_test
        if: ${{ !cancelled() && steps.site_install.outcome == 'success' }}
        run: task site:test
      - id: site_build
        if: ${{ !cancelled() && steps.site_install.outcome == 'success' }}
        run: task site:build

  self-check:
    name: Self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # uploads this repo's SARIF to code scanning on main
    outputs:
      self_check: ${{ steps.self_check.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: task
      - run: task build
      # The action from this checkout, on the binary just built: the same check users run.
      # `./` rather than `$/`: actionlint 1.7.11 doesn't parse `$/` yet, and nothing but
      # this repo's own checkout is in the workspace here.
      - id: self_check
        uses: ./ # zizmor: ignore[self-repository]
        with:
          binary: ./bin/ci-parity
      # The action on a fixture with findings: it must still write its outputs and,
      # with fail-on-error off, succeed. Text format, so no annotations land here.
      - id: action_findings
        uses: ./ # zizmor: ignore[self-repository]
        with:
          binary: ./bin/ci-parity
          working-directory: testdata/fixtures/inline-tools
          format: text
          fail-on-error: "false"
      - env:
          ERRORS: ${{ steps.action_findings.outputs.errors }}
          WARNINGS: ${{ steps.action_findings.outputs.warnings }}
          TOLERATED: ${{ steps.action_findings.outputs.tolerated }}
        run: task action:expect -- 8 0 0
      # This repo's own results in code scanning, through the action's SARIF output.
      - id: sarif
        if: ${{ github.event_name == 'push' }}
        uses: ./ # zizmor: ignore[self-repository]
        with:
          binary: ./bin/ci-parity
          format: sarif
      - if: ${{ github.event_name == 'push' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ steps.sarif.outputs.sarif-file }}
          category: ci-parity

  # Posts (or updates) one comment on the pull request with a table of every check.
  platforms:
    name: Tests (${{ matrix.os }})
    # The Checks job runs every test on Linux; this runs them on the other runner OSes,
    # where paths, line endings and the built binary differ.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: task
      - if: ${{ !cancelled() }}
        run: task test:unit
      - if: ${{ !cancelled() }}
        run: task test:integration
      - if: ${{ !cancelled() }}
        run: task test:e2e
      - if: ${{ !cancelled() }}
        run: task test:perf

  action-download:
    name: Action download (${{ matrix.os }})
    # Self-check runs this checkout's action with a prebuilt binary. This runs the published
    # action as users do: from a commit SHA, with no binary or version input, it resolves
    # the latest release, downloads the runner's archive, verifies it against
    # checksums.txt and runs it. (Run from a local path, the action has no repository to
    # download from.)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: task
      - id: findings
        uses: jimmykurian/ci-parity@6cd6042d59e50d62e0e2fd781c2a0b453f244ced # v0.7.0
        with:
          working-directory: testdata/fixtures/inline-tools
          format: text
          fail-on-error: "false"
      - env:
          ERRORS: ${{ steps.findings.outputs.errors }}
          WARNINGS: ${{ steps.findings.outputs.warnings }}
          TOLERATED: ${{ steps.findings.outputs.tolerated }}
        run: task action:expect -- 8 0 0
      # This repository has no findings, so the downloaded release must pass it.
      - uses: jimmykurian/ci-parity@6cd6042d59e50d62e0e2fd781c2a0b453f244ced # v0.7.0

  report:
    name: Check table
    needs: [checks, self-check, platforms, action-download]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # creates and updates the comment
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const marker = '<!-- pr-check-table -->';
            // Each result is a word; the symbol only repeats it (ACCESSIBILITY.md).
            const shown = {
              success: '✅ Passed',
              failure: '❌ Failed',
              cancelled: '⏹️ Cancelled',
              skipped: '⏭️ Skipped',
            };
            const result = (outcome) => shown[outcome] ?? '⚠️ Not run';

            // [check, task, output] rows per job.
            const sections = [
              {
                title: 'Checks',
                job: 'checks',
                rows: [
                  ['Secret scan, git history (gitleaks)', '', 'secrets'],
                  ['Go format (gofumpt, goimports)', 'fmt:check', 'fmt'],
                  ['Go lint (golangci-lint)', 'lint:go', 'go'],
                  ['Go vulnerabilities (govulncheck)', 'lint:vuln', 'vuln'],
                  ['Workflow lint (actionlint, zizmor)', 'lint:actions', 'actions'],
                  ['Shell lint (shellcheck)', 'lint:shell', 'shell'],
                  ['YAML lint (yamllint)', 'lint:yaml', 'yaml'],
                  ['Markdown lint (markdownlint)', 'lint:markdown', 'markdown'],
                  ['Spelling (typos)', 'lint:spelling', 'spelling'],
                  ['EditorConfig', 'lint:editorconfig', 'editorconfig'],
                  ['License headers', 'lint:headers', 'headers'],
                  ['Release config (goreleaser check)', 'lint:release', 'release'],
                  ['Unit tests', 'test:unit', 'unit'],
                  ['Integration tests (golden fixtures)', 'test:integration', 'integration'],
                  ['End-to-end tests (built binary)', 'test:e2e', 'e2e'],
                  ['Docs site sync tests', 'site:test', 'site_test'],
                  ['Docs site build and link check', 'site:build', 'site_build'],
                  ['Build', 'build', 'build'],
                ],
              },
              {
                title: 'Self-check',
                job: 'self-check',
                rows: [['ci-parity on its own workflows, through the action', '', 'self_check']],
              },
              {
                title: 'Other platforms',
                job: 'platforms',
                rows: [['Unit, integration, end-to-end and performance tests on macOS and Windows', '', 'job']],
              },
              {
                title: 'Action download',
                job: 'action-download',
                rows: [['The action, downloading and verifying the latest release on Linux, macOS and Windows', '', 'job']],
              },
            ];

            const failed = Object.values(needs).some(({ result: r }) => r !== 'success');
            const lines = [];
            for (const { title, job, rows } of sections) {
              const { result: jobResult, outputs = {} } = needs[job] ?? {};
              lines.push(`### ${title}`, '');
              if (jobResult === 'cancelled') {
                lines.push('⏹️ *Cancelled*', '');
                continue;
              }
              lines.push('| Check | Task | Result |', '|:------|:-----|:-------|');
              for (const [label, task, key] of rows) {
                const how = task
                  ? `\`task ${task}\``
                  : key === 'secrets'
                    ? 'gitleaks-action'
                    : key === 'job' && job === 'platforms'
                      ? '`task test:*`'
                      : '`uses: ./`';
                lines.push(`| ${label} | ${how} | ${result(key === 'job' ? jobResult : outputs[key])} |`);
              }
              lines.push('');
            }

            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## PR check results',
              '',
              `**Overall:** ${failed ? '❌ Some checks failed or didn\'t run' : '✅ All checks passed'}`,
              '',
              ...lines,
              '---',
              `<sub>Commit \`${process.env.HEAD_SHA.slice(0, 7)}\` · [View run](${run})</sub>`,
              '',
              marker,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  # Writes one shields.io endpoint JSON per check to the badges branch, for the README's
  # status table. Only main's results count. One commit through the Git Data API, so no
  # git credentials stay on the runner.
  badges:
    name: Badges
    needs: [checks, self-check, platforms, action-download]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # commits to the badges branch
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const badge = (message, color) => ({ schemaVersion: 1, label: '', message, color });
            const status = (outcome) =>
              outcome === 'success'
                ? badge('passing', 'brightgreen')
                : outcome === 'failure'
                  ? badge('failing', 'red')
                  : badge(outcome || 'not run', 'lightgrey');

            const c = needs.checks?.outputs ?? {};
            const s = needs['self-check']?.outputs ?? {};
            const files = {
              'checks/format.json': status(c.fmt),
              'checks/lint.json': status(c.go),
              'checks/workflows.json': status(c.actions),
              'checks/shell.json': status(c.shell),
              'checks/yaml.json': status(c.yaml),
              'checks/markdown.json': status(c.markdown),
              'checks/spelling.json': status(c.spelling),
              'checks/editorconfig.json': status(c.editorconfig),
              'checks/headers.json': status(c.headers),
              'checks/release.json': status(c.release),
              'build/unit-tests.json': status(c.unit),
              'build/integration-tests.json': status(c.integration),
              'build/e2e-tests.json': status(c.e2e),
              'build/docs-site.json': status(c.site_build),
              'build/build.json': status(c.build),
              'build/self-check.json': status(s.self_check),
              'build/platforms.json': status(needs.platforms?.result),
              'build/action-download.json': status(needs['action-download']?.result),
              'security/gitleaks.json': status(c.secrets),
              'security/govulncheck.json': status(c.vuln),
            };

            const { owner, repo } = context.repo;
            const ref = 'heads/badges';
            let parent;
            try {
              parent = (await github.rest.git.getRef({ owner, repo, ref })).data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const tree = await github.rest.git.createTree({
              owner,
              repo,
              tree: Object.entries(files).map(([path, data]) => ({
                path,
                mode: '100644',
                type: 'blob',
                content: `${JSON.stringify(data)}\n`,
              })),
            });
            if (parent) {
              const { data: last } = await github.rest.git.getCommit({ owner, repo, commit_sha: parent });
              if (last.tree.sha === tree.data.sha) return core.info('Badges unchanged');
            }
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: `chore: update the CI badges for ${context.sha.slice(0, 7)}`,
              tree: tree.data.sha,
              parents: parent ? [parent] : [],
            });
            if (parent) await github.rest.git.updateRef({ owner, repo, ref, sha: commit.data.sha });
            else await github.rest.git.createRef({ owner, repo, ref: `refs/${ref}`, sha: commit.data.sha });
            core.info(`Updated ${Object.keys(files).length} badges`);
