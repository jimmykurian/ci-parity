name: ci

# Every check, then a table of their results on the pull request:
#
#   checks ─────┬─ report (the PR comment)
#   self-check ─┴─ badges (main only: the README status table)
#
# Each check is its own step running a task from Taskfile.yml, with tools from
# mise.toml, so CI runs the same commands as a local `task ci`. Every step runs even
# when an earlier one fails (`!cancelled()`), so the table shows each result, and any
# failed step still fails its job.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # gitleaks-action lists a pull request's commits to scan them.
      pull-requests: read
    outputs:
      secrets: ${{ steps.secrets.outcome }}
      fmt: ${{ steps.fmt.outcome }}
      go: ${{ steps.go.outcome }}
      vuln: ${{ steps.vuln.outcome }}
      actions: ${{ steps.actions.outcome }}
      shell: ${{ steps.shell.outcome }}
      yaml: ${{ steps.yaml.outcome }}
      markdown: ${{ steps.markdown.outcome }}
      spelling: ${{ steps.spelling.outcome }}
      editorconfig: ${{ steps.editorconfig.outcome }}
      test: ${{ steps.test.outcome }}
      build: ${{ steps.build.outcome }}
      scrub: ${{ steps.scrub.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21

      - id: secrets
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The same tasks as `task ci`, one step each.
      - id: fmt
        if: ${{ !cancelled() }}
        run: task fmt:check
      - id: go
        if: ${{ !cancelled() }}
        run: task lint:go
      - id: vuln
        if: ${{ !cancelled() }}
        run: task lint:vuln
      - id: actions
        if: ${{ !cancelled() }}
        run: task lint:actions
      - id: shell
        if: ${{ !cancelled() }}
        run: task lint:shell
      - id: yaml
        if: ${{ !cancelled() }}
        run: task lint:yaml
      - id: markdown
        if: ${{ !cancelled() }}
        run: task lint:markdown
      - id: spelling
        if: ${{ !cancelled() }}
        run: task lint:spelling
      - id: editorconfig
        if: ${{ !cancelled() }}
        run: task lint:editorconfig
      - id: test
        if: ${{ !cancelled() }}
        run: task test
      - id: build
        if: ${{ !cancelled() }}
        run: task build
      - id: scrub
        if: ${{ !cancelled() }}
        run: task scrub

  self-check:
    name: Self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      self_check: ${{ steps.self_check.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: task
      - id: self_check
        run: task self-check

  # Posts (or updates) one comment on the pull request with a table of every check.
  report:
    name: Check table
    needs: [checks, self-check]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # creates and updates the comment
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const marker = '<!-- pr-check-table -->';
            // Each result is a word; the symbol only repeats it (ACCESSIBILITY.md).
            const shown = {
              success: '✅ Passed',
              failure: '❌ Failed',
              cancelled: '⏹️ Cancelled',
              skipped: '⏭️ Skipped',
            };
            const result = (outcome) => shown[outcome] ?? '⚠️ Not run';

            // [check, task, output] rows per job.
            const sections = [
              {
                title: 'Checks',
                job: 'checks',
                rows: [
                  ['Secret scan, git history (gitleaks)', '', 'secrets'],
                  ['Go format (gofumpt, goimports)', 'fmt:check', 'fmt'],
                  ['Go lint (golangci-lint)', 'lint:go', 'go'],
                  ['Go vulnerabilities (govulncheck)', 'lint:vuln', 'vuln'],
                  ['Workflow lint (actionlint, zizmor)', 'lint:actions', 'actions'],
                  ['Shell lint (shellcheck)', 'lint:shell', 'shell'],
                  ['YAML lint (yamllint)', 'lint:yaml', 'yaml'],
                  ['Markdown lint (markdownlint)', 'lint:markdown', 'markdown'],
                  ['Spelling (typos)', 'lint:spelling', 'spelling'],
                  ['EditorConfig', 'lint:editorconfig', 'editorconfig'],
                  ['Tests and golden fixtures', 'test', 'test'],
                  ['Build', 'build', 'build'],
                  ['Forbidden terms (scrub)', 'scrub', 'scrub'],
                ],
              },
              {
                title: 'Self-check',
                job: 'self-check',
                rows: [['ci-parity on its own workflows', 'self-check', 'self_check']],
              },
            ];

            const failed = Object.values(needs).some(({ result: r }) => r !== 'success');
            const lines = [];
            for (const { title, job, rows } of sections) {
              const { result: jobResult, outputs = {} } = needs[job] ?? {};
              lines.push(`### ${title}`, '');
              if (jobResult === 'cancelled') {
                lines.push('⏹️ *Cancelled*', '');
                continue;
              }
              lines.push('| Check | Task | Result |', '|:------|:-----|:-------|');
              for (const [label, task, key] of rows) {
                lines.push(`| ${label} | ${task ? `\`task ${task}\`` : 'gitleaks-action'} | ${result(outputs[key])} |`);
              }
              lines.push('');
            }

            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## PR check results',
              '',
              `**Overall:** ${failed ? '❌ Some checks failed or didn\'t run' : '✅ All checks passed'}`,
              '',
              ...lines,
              '---',
              `<sub>Commit \`${process.env.HEAD_SHA.slice(0, 7)}\` · [View run](${run})</sub>`,
              '',
              marker,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  # Writes one shields.io endpoint JSON per check to the badges branch, for the README's
  # status table. Only main's results count. One commit through the Git Data API, so no
  # git credentials stay on the runner.
  badges:
    name: Badges
    needs: [checks, self-check]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # commits to the badges branch
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const badge = (message, color) => ({ schemaVersion: 1, label: '', message, color });
            const status = (outcome) =>
              outcome === 'success'
                ? badge('passing', 'brightgreen')
                : outcome === 'failure'
                  ? badge('failing', 'red')
                  : badge(outcome || 'not run', 'lightgrey');

            const c = needs.checks?.outputs ?? {};
            const s = needs['self-check']?.outputs ?? {};
            const files = {
              'checks/format.json': status(c.fmt),
              'checks/lint.json': status(c.go),
              'checks/workflows.json': status(c.actions),
              'checks/shell.json': status(c.shell),
              'checks/yaml.json': status(c.yaml),
              'checks/markdown.json': status(c.markdown),
              'checks/spelling.json': status(c.spelling),
              'checks/editorconfig.json': status(c.editorconfig),
              'build/tests.json': status(c.test),
              'build/build.json': status(c.build),
              'build/self-check.json': status(s.self_check),
              'security/gitleaks.json': status(c.secrets),
              'security/govulncheck.json': status(c.vuln),
              'security/scrub.json': status(c.scrub),
            };

            const { owner, repo } = context.repo;
            const ref = 'heads/badges';
            let parent;
            try {
              parent = (await github.rest.git.getRef({ owner, repo, ref })).data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const tree = await github.rest.git.createTree({
              owner,
              repo,
              tree: Object.entries(files).map(([path, data]) => ({
                path,
                mode: '100644',
                type: 'blob',
                content: `${JSON.stringify(data)}\n`,
              })),
            });
            if (parent) {
              const { data: last } = await github.rest.git.getCommit({ owner, repo, commit_sha: parent });
              if (last.tree.sha === tree.data.sha) return core.info('Badges unchanged');
            }
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: `chore: update the CI badges for ${context.sha.slice(0, 7)}`,
              tree: tree.data.sha,
              parents: parent ? [parent] : [],
            });
            if (parent) await github.rest.git.updateRef({ owner, repo, ref, sha: commit.data.sha });
            else await github.rest.git.createRef({ owner, repo, ref: `refs/${ref}`, sha: commit.data.sha });
            core.info(`Updated ${Object.keys(files).length} badges`);
