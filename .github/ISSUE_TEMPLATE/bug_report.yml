name: Bug Report
description: ci-parity crashes, rejects valid input, or prints wrong output
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Report a crash, an error on valid input, or wrong output. If a rule
        flagged the wrong step or missed one, use the "Wrong Finding" template
        instead. Security issues go through SECURITY.md.

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `ci-parity version`, or the Action ref you use.
      placeholder: "ci-parity v0.1.0 (abc1234, 2026-10-27T00:00:00Z)"
    validations:
      required: true

  - type: dropdown
    id: how
    attributes:
      label: How You Run It
      options:
        - CLI, locally
        - CLI, in CI
        - GitHub Action
        - go install
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command
      description: The full command with its flags.
      placeholder: "ci-parity check --format github --baseline .ci-parity-baseline.json"
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Minimal Input
      description: |
        The smallest workflow, Taskfile and `.ci-parity.yml` that show the
        problem. Use invented names; don't paste private code.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should ci-parity have printed, and with which exit code?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What it printed, with the exit code (`echo $?`).
      render: text
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "ubuntu-latest, macOS 26 arm64, Windows 11"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
    validations:
      required: false
