name: Subtask
description: One piece of work that is part of a larger issue
title: "[Subtask]: "
labels: ["subtask"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for one piece of work that belongs to a parent
        issue.

  - type: input
    id: parent
    attributes:
      label: Parent
      description: The parent issue.
      placeholder: "#123"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - domain or rules
        - app (use cases)
        - adapters (config, workflow, shell, runner, baseline, report)
        - cmd (CLI)
        - Fixtures and goldens
        - GitHub Action or releases
        - Build, CI or tooling
        - Documentation
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] A fixture covers the behavior in all three formats
        - [ ] `task ci` passes
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files to Modify
      placeholder: |
        - `internal/rules/check.go`
        - `testdata/fixtures/<case>/`
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: "Blocked by #124"
    validations:
      required: false
