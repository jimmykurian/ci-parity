# typos: spelling in code, docs, workflows and fixtures. Run by `task lint:spelling`.
[files]
# CHANGELOG.md is generated by Release Please and lists commit SHAs.
extend-exclude = [".git/", "LICENSE", "go.sum", "CHANGELOG.md"]

[default.extend-words]
# A deliberate misspelling: fixtures and tests use it to check P002's
# closest-task suggestion.
biuld = "biuld"
# Spelled this way in docs/reference/cli.md; both spellings are standard.
unparseable = "unparseable"
