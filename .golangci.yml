version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    gosec:
      excludes:
        # Reading the workflows, Taskfiles, config and baseline a user points
        # at is the tool's job, so every read is "file inclusion via variable".
        - G304
    errcheck:
      # Writes of CLI output to stdout and stderr have no useful recovery.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Tests and the golden harness write temporary files with ordinary modes.
      - path: '(_test\.go$|^internal/testutil/)'
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jimmykurian/ci-parity
