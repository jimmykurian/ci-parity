version: "2"

linters:
  default: standard
  enable:
    - gocritic
    - revive
  settings:
    errcheck:
      # Writes of CLI output to stdout and stderr have no useful recovery.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
