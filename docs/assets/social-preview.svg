<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title">
  <title id="title">ci-parity: check that CI runs your Taskfile, not inline tools</title>
  <rect width="1280" height="640" fill="#0B1F3A"/>
  <g transform="translate(120 200) scale(2)">
    <rect x="1" y="1" width="118" height="118" rx="28" fill="#132B4D" stroke="#22406B" stroke-width="2"/>
    <path d="M24 36 C40 36 44 60 58 60" fill="none" stroke="#58A6FF" stroke-width="6" stroke-linecap="round"/>
    <path d="M24 84 C40 84 44 60 58 60" fill="none" stroke="#E6EDF3" stroke-width="6" stroke-linecap="round"/>
    <circle cx="24" cy="36" r="6" fill="#58A6FF"/>
    <circle cx="24" cy="84" r="6" fill="#E6EDF3"/>
    <polyline points="64 46 78 60 64 74" fill="none" stroke="#E6EDF3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="84" y1="76" x2="100" y2="76" stroke="#58A6FF" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="440" y="300" fill="#E6EDF3" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="96" font-weight="600">ci-parity</text>
  <text x="444" y="372" fill="#9FB3C8" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34">Check that CI runs your Taskfile,</text>
  <text x="444" y="418" fill="#9FB3C8" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34">not inline tools.</text>
</svg>
